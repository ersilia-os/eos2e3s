Identifier: eos2e3s
Slug: antimicrobial-activity-paeruginosa
Status: Ready
Title: Antimicrobial activity prediction against Pseudomonas aeruginosa from 
  public ChEMBL data
Description: Ranks compounds for their likelihood of inhibiting Pseudomonas aeruginosa,
  an opportunistic pathogen with formidable intrinsic resistance. Binary classifiers
  were fitted separately over each usable pool of ChEMBL bioactivity data, keeping
  single-point percentage inhibition apart from dose-response MIC measurements because
  the two express activity differently. Their outputs feed a quality-weighted consensus
  that leans on models built from larger and better-supported assay pools.
